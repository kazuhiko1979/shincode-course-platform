name: CI

# 目的: PR / main への push で lint・typecheck・unit test・build を必ず実行する
# （「テストを必ず実行する」の強制力。単体テストは Node 組み込み node:test・依存ゼロ）。
on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチの古い実行はキャンセルして無駄を減らす
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint と typecheck は環境変数不要。壊れていれば即失敗させる。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 単体テスト（node:test・環境変数不要・~0.5s）
      - name: Unit tests
        run: npm test

      # next build は公開ページが Supabase 公開クライアントを参照するため
      # publishable（公開可）キーが必要。GitHub の
      #   Settings > Secrets and variables > Actions
      # に以下を登録すること（service_role など秘密鍵は登録しない）:
      #   NEXT_PUBLIC_SUPABASE_URL
      #   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify summary
        if: always()
        run: echo "CI verification completed for ${{ github.ref_name }}"
